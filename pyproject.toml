[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-judgment-lab"
version = "0.2.0"
description = "Offline research tools for wine-assessment evidence and identity sensitivity"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Woody Wu"}]
dependencies = []

[project.scripts]
wine-judgment-lab = "wine_judgment_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["wine_judgment_lab*"]

[tool.setuptools.package-data]
wine_judgment_lab = ["data/*.json", "data/*.jsonl", "data/*.md"]
